# Porta onde o backend fica escutando. Local sempre 8080; no Render, a
# plataforma injeta a variavel de ambiente PORT com a porta certa - o
# "${PORT:8080}" usa ela se existir, senao cai no 8080.
server.port=${PORT:8080}

# Conexao com o MESMO Postgres do Render que o BriqueApp usa (banco
# "brique_app"), mas usando um schema proprio ("textil") pra nao misturar
# as tabelas dos dois projetos. "currentSchema=textil" faz o driver JDBC
# usar esse schema por padrao em toda conexao.
#
# URL/username nao sao segredo de verdade (so dizem ONDE e COM QUE USUARIO
# conectar, inuteis sem a senha) - mantidos como padrao pra rodar local sem
# configurar nada. A SENHA e o segredo de verdade: sem valor padrao de
# proposito. DATABASE_PASSWORD precisa estar definida no painel do Render
# (Environment do servico) e, pra rodar local, no seu ambiente - sem ela o
# boot falha na conexao, de proposito (melhor falhar cedo do que expor senha
# no codigo).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://dpg-d9oadojncjis73bkvje0-a.oregon-postgres.render.com:5432/brique_app?sslmode=require&currentSchema=textil}
spring.datasource.username=${DATABASE_USERNAME:brique_app_user}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Diz pro Hibernate usar o schema "textil" como padrao ao gerar/consultar
# tabelas (reforca o currentSchema da URL acima).
spring.jpa.properties.hibernate.default_schema=textil

# "update" faz o Hibernate criar/ajustar as tabelas sozinho a partir das
# classes @Entity, sem precisar escrever CREATE TABLE na mao enquanto o
# projeto esta em desenvolvimento.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console o SQL que o Hibernate roda por baixo dos panos - util
# pra aprender/depurar, pode desligar (false) mais pra frente.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
